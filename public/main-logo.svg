      <line class="news-text" x1="6" y1="73" x2="35" y2="73" />
      <line class="news-text" x1="49" y1="72" x2="79" y2="72" />
      <line class="news-text" x1="93" y1="73" x2="130" y2="73" />
      <line class="news-text" x1="143" y1="74" x2="171" y2="74" />

      <line class="news-text" x1="13" y1="96" x2="42" y2="96" />
